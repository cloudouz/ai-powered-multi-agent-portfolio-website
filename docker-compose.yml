services:
  backend:
    build: ./backend
    environment:
      - ENV=development
      - JWT_SECRET=devsecret
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CORS_ORIGINS=http://localhost:3000
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports: ["3000:3000"]
